[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oreilly2pdf"
version = "0.1.1"
description = "Export O'Reilly books as high-quality PDF via headless Chrome"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "cruzlorite" }]
keywords = ["oreilly", "pdf", "ebook", "export", "selenium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "selenium>=4.20",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/cruzlorite/oreilly2pdf"
Repository = "https://github.com/cruzlorite/oreilly2pdf"
Issues = "https://github.com/cruzlorite/oreilly2pdf/issues"

[project.scripts]
oreilly2pdf = "oreilly2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
